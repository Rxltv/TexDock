<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Integración DOM de LatexCodeEditor</title>
    <style>
      :root {
        --color-bg: #020305;
        --color-surface: #07090c;
        --color-surface-subtle: #0c0f14;
        --color-surface-elevated: #11151b;
        --color-text: #f4f5f7;
        --color-text-secondary: #858d99;
        --color-border-strong: #2a313c;
        --color-practice: #fbbf24;
        --font-sans: system-ui, sans-serif;
        --font-mono: monospace;
      }
      [data-theme="light"] {
        --color-bg: #f8f9fb;
        --color-surface: #ffffff;
        --color-surface-subtle: #f2f4f7;
        --color-surface-elevated: #eef0f3;
        --color-text: #17191d;
        --color-text-secondary: #6b7381;
        --color-border-strong: #b6bec9;
        --color-practice: #b45309;
      }
      .cm-tooltip-autocomplete {
        background: var(--color-surface-elevated);
        border: 1px solid var(--color-border-strong);
        border-radius: 4px;
        box-sizing: border-box;
        color: var(--color-text);
        max-width: min(30rem, calc(100vw - 1rem));
        min-width: min(18rem, calc(100vw - 1rem));
        overflow: hidden;
        padding: 0.25rem;
      }
      .cm-tooltip-autocomplete > ul {
        list-style: none;
        max-height: 16rem;
        overflow: hidden !important;
        overflow-y: hidden !important;
        scrollbar-width: none;
      }
      .cm-tooltip-autocomplete > ul::-webkit-scrollbar {
        display: none;
      }
      .cm-tooltip-autocomplete .cm-completionIcon {
        display: none;
        height: 0;
        margin: 0;
        min-width: 0;
        padding: 0;
        width: 0;
      }
      .cm-tooltip-autocomplete > ul > li {
        align-items: center;
        border-left: 2px solid transparent;
        color: var(--color-text);
        display: flex;
        gap: 0.75rem;
        line-height: 1.35;
        min-width: 0;
        padding: 0.4rem 0.55rem;
      }
      .cm-tooltip-autocomplete > ul > li:hover {
        background: var(--color-surface-subtle) !important;
      }
      .cm-tooltip-autocomplete > ul > li[aria-selected="true"] {
        background: var(--color-surface-elevated) !important;
        border-left-color: var(--color-practice) !important;
      }
      .cm-tooltip-autocomplete .cm-completionLabel {
        color: var(--color-text);
        flex: 1 1 auto;
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        font-weight: 600;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cm-tooltip-autocomplete .cm-completionDetail {
        color: var(--color-text-secondary);
        flex: 0 1 11rem;
        font-family: var(--font-sans);
        font-size: 0.75rem;
        font-style: normal;
        min-width: 0;
        overflow: hidden;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="formula-root"></div>
    <div id="exercise-root"></div>
    <div id="progress-root">
      <div data-progress-section="s1" data-progress-state="unlocked">
        <button type="button" data-progress-section-toggle aria-controls="fixture-s1" aria-expanded="true">Sección 1</button>
        <div id="fixture-s1" data-progress-section-panel>
          <div data-progress-lesson="l1" data-progress-state="unlocked">
            <a class="subsection-link" data-progress-href="/l1" href="/l1">Lección 1</a>
          </div>
          <div data-progress-lesson="l2" data-progress-state="locked">
            <a class="subsection-link" data-progress-href="/l2" aria-disabled="true" tabindex="-1">Lección 2</a>
          </div>
        </div>
      </div>
      <div data-progress-section="s2" data-progress-state="locked">
        <button type="button" data-progress-section-toggle aria-controls="fixture-s2" aria-expanded="false" aria-disabled="true" disabled>Sección 2</button>
        <div id="fixture-s2" data-progress-section-panel hidden>
          <div data-progress-lesson="l3" data-progress-state="locked">
            <a class="subsection-link" data-progress-href="/l3" aria-disabled="true" tabindex="-1">Lección 3</a>
          </div>
        </div>
      </div>
      <span data-progress-label></span>
      <span data-progress-meter></span>
      <span data-progress-percent></span>
      <a
        data-progress-navigation
        data-progress-href="/p1-next"
        data-progress-target-section="s1"
        data-progress-target-lesson="l1"
        data-progress-target-page="p1-next"
      >Continuar fixture</a>
      <button type="button" data-progress-reset>Reiniciar progreso</button>
      <p data-progress-notice hidden><span data-progress-notice-text></span><button type="button" data-progress-notice-dismiss>Entendido</button></p>
    </div>
    <script type="module" src="./editorBrowserEntry.tsx"></script>
  </body>
</html>
